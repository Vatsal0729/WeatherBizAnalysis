[project]
name = "weatherbizanalysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0,<4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "statsmodels>=0.14.4,<0.15",
    "scikit-learn>=1.4,<2",
    "pyarrow>=16,<24",
]

[tool.vercel]
entrypoint = "website.server:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
